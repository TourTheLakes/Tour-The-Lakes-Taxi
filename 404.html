<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <title>Page Not Found | Tour The Lakes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="images/TTLFAVIcon.png" />
  <link rel="apple-touch-icon" href="images/TTLFAVIcon.png" />

  <style>
    html, body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: transparent;
      overflow-x: hidden;
    }

    html { background-color: #2b2b2b; }

    body {
      position: relative;
      isolation: isolate;
      padding-top: 172px;
      color: rgba(255,255,255,0.92);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #2b2b2b;
      background-image: url("images/Web Paper BG.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .site-header {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: #2b2b2b;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.20), rgba(0, 0, 0, 0.20)),
        url("images/Web Paper 5.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      color: rgba(255,255,255,0.92);
      border-bottom: 2px solid #b86b2a;
    }

    .header-inner {
      min-height: 170px;
      display: flex;
      align-items: end;
      justify-content: center;
      padding: 18px 16px 26px;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 0;
    }

    .header-home-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .header-logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      margin: 0 auto 10px;
    }

    .header-established {
      color: rgba(255,255,255,0.65);
      font: 600 9px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .brand {
      color: rgba(255,255,255,0.92);
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .error-main {
      min-height: calc(100vh - 172px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 24px;
      text-align: center;
    }

    .error-content {
      width: min(760px, 100%);
    }

    .error-code {
      margin: 0 0 12px;
      color: #b86b2a;
      font-size: clamp(72px, 16vw, 150px);
      font-weight: 700;
      letter-spacing: -5px;
      line-height: .85;
    }

    .error-title {
      margin: 0;
      color: rgba(255,255,255,0.94);
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 620;
      letter-spacing: -1.4px;
      line-height: 1.04;
    }

    .error-rule {
      width: 54px;
      height: 2px;
      margin: 26px auto;
      background: #b86b2a;
    }

    .error-copy {
      max-width: 600px;
      margin: 0 auto;
      color: rgba(255,255,255,0.68);
      font-size: 17px;
      line-height: 1.65;
    }

    .return-home {
      display: inline-block;
      margin-top: 34px;
      padding: 13px 20px;
      color: rgba(255,255,255,0.94);
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .7px;
      text-transform: uppercase;
      background: rgba(184,107,42,0.12);
      border-bottom: 2px solid #b86b2a;
    }

    .return-home:hover,
    .return-home:focus-visible {
      background: rgba(184,107,42,0.24);
      outline: none;
    }

    @media (max-width: 600px) {
      body { padding-top: 172px; }
      .error-main {
        min-height: calc(100vh - 172px);
        padding: 52px 20px;
      }
      .error-code { letter-spacing: -3px; }
      .error-copy { font-size: 16px; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <a class="header-home-link" href="index.html" aria-label="Tour The Lakes home">
          <img class="header-logo" src="images/TTL Vinyl Logo.png" alt="Tour The Lakes" />
          <div class="header-established">Established 2023</div>
          <div class="brand">Tour The Lakes</div>
        </a>
      </div>
    </div>
  </header>

  <main class="error-main">
    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code">404</p>
      <h1 class="error-title" id="error-title">This page could not be found</h1>
      <div class="error-rule" aria-hidden="true"></div>
      <p class="error-copy">
        The page you were looking for may have moved or may no longer be available.
      </p>
      <a class="return-home" href="index.html">Return Home</a>
    </section>
  </main>
</body>
</html>
