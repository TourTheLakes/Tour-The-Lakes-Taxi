<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tour The Lakes – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" type="image/png" href="images/TTLFAVIcon.png" />

  <style>
    :root {
      --ink: #2b2b2b;
      --orange: #b86b2a;
      --white: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --line: rgba(184,107,42,0.42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background-color: var(--ink);
      background-image:
        linear-gradient(rgba(43,43,43,0.88), rgba(43,43,43,0.88)),
        url("images/Web Paper BG.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--white);
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .site-header {
      width: 100%;
      background-color: var(--ink);
      background-image:
        linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.20)),
        url("images/Web Paper 5.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      border-bottom: 2px solid var(--orange);
    }

    .header-inner {
      min-height: 104px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 24px clamp(20px,5vw,72px) 22px;
    }

    .brand {
      font-size: clamp(24px,4vw,42px);
      font-weight: 650;
      letter-spacing: -0.8px;
    }

    .brand-sub {
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      padding-bottom: 4px;
    }

    .admin-main,
    .admin-wrap {
      width: 100%;
    }


    .admin-nav {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: rgba(43,43,43,0.94);
      border-bottom: 2px solid var(--orange);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .admin-nav button {
      min-height: 58px;
      border: 0;
      border-right: 1px solid rgba(184,107,42,0.32);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .4px;
    }

    .admin-nav button:last-child { border-right: 0; }

    .admin-nav button.is-active {
      color: var(--white);
      background: rgba(184,107,42,0.16);
    }

    .admin-nav button.is-active::after {
      content: "";
      display: block;
      width: 34px;
      height: 2px;
      margin: 8px auto -10px;
      background: var(--orange);
    }

    .admin-panel {
      display: none;
      width: 100%;
    }

    .admin-panel.is-active {
      display: block;
    }

    .admin-section {
      width: 100%;
      padding: 42px clamp(20px,5vw,72px) 48px;
      border-bottom: 2px solid var(--orange);
    }

    .admin-section:last-child { border-bottom: 0; }

    .admin-content {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .admin-section-title {
      color: var(--white);
      font-size: clamp(30px,5vw,52px);
      line-height: 1.02;
      font-weight: 620;
      letter-spacing: -1.4px;
      margin: 0 0 14px;
    }

    .admin-subtitle {
      margin: 34px 0 12px;
      color: var(--white);
      font-size: 21px;
      line-height: 1.15;
      font-weight: 650;
    }

    .admin-lead {
      max-width: 760px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 28px;
    }

    .admin-msg {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .admin-msg.ok { color: #8fe0b9; }
    .admin-msg.bad { color: #ff9a9a; }

    .admin-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .admin-field {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(184,107,42,0.62);
      border-radius: 0;
      outline: none;
      background: rgba(255,255,255,0.045);
      color: var(--white);
      padding: 14px 12px;
      font-size: 16px;
      line-height: 1.3;
    }

    .admin-field:focus {
      border-bottom-color: var(--orange);
      background: rgba(255,255,255,0.075);
    }

    .admin-btn {
      width: auto;
      min-width: 150px;
      border: 0;
      border-bottom: 2px solid var(--orange);
      border-radius: 0;
      background: rgba(184,107,42,0.12);
      color: var(--white);
      padding: 13px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .45px;
      text-transform: uppercase;
    }

    .admin-btn:hover { background: rgba(184,107,42,0.24); }
    .admin-btn.primary { background: var(--orange); color: #fff; }
    .admin-btn.quiet {
      border-bottom-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.04);
    }

    #driversList > div {
      cursor: pointer;
      transition: padding-left .15s ease, background .15s ease;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 18px 0;
    }

    #driversList > div:first-child {
      border-top: 1px solid var(--line);
    }

    #driversList > div:hover {
      padding-left: 12px;
      background: rgba(184,107,42,.08);
    }

    .site-footer {
      width: 100%;
      border-top: 2px solid var(--orange);
      background-color: var(--ink);
      background-image:
        linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,.20)),
        url("images/Web Paper 5.png");
      background-size: cover;
      background-position: center top;
    }

    .footer-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      padding: 0 clamp(20px,5vw,72px);
    }

    .footer-text {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .header-inner {
        min-height: 88px;
        align-items: center;
      }

      .brand-sub { display: none; }

      .admin-nav button {
        min-height: 54px;
        font-size: 12px;
      }

      .admin-section {
        padding-top: 32px;
        padding-bottom: 38px;
      }

      .admin-actions {
        flex-direction: column;
      }

      .admin-actions .admin-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">Tour The Lakes</div>
      <div class="brand-sub">Operations Admin</div>
    </div>
  </header>

  <script>
    (() => {
      const buttons = Array.from(document.querySelectorAll("[data-admin-panel]"));
      const panels = Array.from(document.querySelectorAll(".admin-panel"));

      function showPanel(id) {
        panels.forEach((panel) => panel.classList.toggle("is-active", panel.id === id));
        buttons.forEach((button) => button.classList.toggle("is-active", button.dataset.adminPanel === id));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => showPanel(button.dataset.adminPanel));
      });
    })();
  </script>

  <main class="admin-main">
    <div class="admin-wrap">
      <nav class="admin-nav" aria-label="Admin areas">
        <button type="button" class="is-active" data-admin-panel="bookingsPanel">Bookings</button>
        <button type="button" data-admin-panel="toursPanel">Tours</button>
        <button type="button" data-admin-panel="schedulePanel">Schedule</button>
        <button type="button" data-admin-panel="driversPanel">Drivers</button>
      </nav>

      <section id="bookingsPanel" class="admin-panel is-active"></section>
      <section id="toursPanel" class="admin-panel"></section>
      <section id="schedulePanel" class="admin-panel"></section>

      <section id="driversPanel" class="admin-panel">
        <div class="admin-section">
          <div class="admin-content">
            <div class="eyebrow">Staff access</div>
            <h1 class="admin-section-title" id="driverEditorTitle">Drivers</h1>
            <p class="admin-lead" id="driverEditorLead">Create a driver profile. The email address is the Google account that will be used to authorise the driver in the Tour The Lakes app.</p>

            <div class="admin-stack">
              <div class="field-group">
                <label class="field-label" for="driverName">Name</label>
                <input id="driverName" type="text" class="admin-field" autocomplete="off" />
              </div>

              <div class="field-group">
                <label class="field-label" for="driverBadgeNo">Badge No</label>
                <input id="driverBadgeNo" type="text" class="admin-field" autocomplete="off" />
              </div>

              <div class="field-group">
                <label class="field-label" for="driverBadgeExpiry">Badge Expiry</label>
                <input id="driverBadgeExpiry" type="date" class="admin-field" />
              </div>

              <div class="field-group">
                <label class="field-label" for="driverEmail">Email</label>
                <input id="driverEmail" type="email" class="admin-field" autocomplete="off" />
              </div>

              <div class="field-group">
                <label class="field-label" for="driverPhone">Phone Number <span style="text-transform:none;letter-spacing:0;font-weight:500;">(optional)</span></label>
                <input id="driverPhone" type="tel" class="admin-field" autocomplete="off" />
              </div>

              <div id="driverMsg" class="admin-msg"></div>
            </div>

            <div class="admin-actions">
              <button id="saveDriver" type="button" class="admin-btn primary">Create driver</button>
              <button id="cancelDriverEdit" type="button" class="admin-btn quiet" hidden>Back to new driver</button>
            </div>
          </div>
        </div>

        <div class="admin-section">
          <div class="admin-content">
            <div class="eyebrow">Driver profiles</div>
            <div class="admin-subtitle" style="margin-top:0;">Existing drivers</div>
            <div id="driversListMsg" class="admin-msg">Loading…</div>
            <div id="driversList" class="admin-list" style="margin-top:16px;"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-text">© Tour The Lakes · Operations Admin</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      update,
      onValue,
      query,
      orderByChild,
      equalTo,
      get,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";
    import {
      getStorage,
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";

    import {
      getAuth,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      setPersistence,
      browserLocalPersistence,
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9EdglxWetAv81qe1GnwlMf7HbPccjXxQ",
      authDomain: "tourthelakes-1e165.firebaseapp.com",
      databaseURL: "https://tourthelakes-1e165-default-rtdb.firebaseio.com",
      projectId: "tourthelakes-1e165",
      storageBucket: "tourthelakes-1e165.firebasestorage.app",
      messagingSenderId: "470758171431",
      appId: "1:470758171431:web:f06dd39b0f15b63b2bff02",
      measurementId: "G-W6JY1LZXTP",
    };

    const ALLOWED_EMAILS = new Set([
      "info@tourthelakes.com",
      "georgina@tourthelakes.com",
    ]);

    const app = initializeApp(firebaseConfig);

    // Realtime Database is retained ONLY for the existing Drivers/App connection.
    const db = getDatabase(app);

    // Firebase Storage is initialised and ready for the rebuilt backend.
    const storage = getStorage(app);

    const auth = getAuth(app);

    // Keep the authorised admin signed in across refreshes, tabs and browser restarts.
    // There is deliberately no inactivity/session timeout in this admin page.
    try {
      await setPersistence(auth, browserLocalPersistence);
    } catch (err) {
      console.error("Could not set persistent Firebase Auth session:", err);
    }

    const adminMain = document.querySelector(".admin-main");
    if (adminMain) adminMain.style.display = "none";

    const bar = document.createElement("div");
    bar.style.borderBottom = "1px solid #b86b2a";
    bar.style.padding = "10px 16px";
    bar.style.display = "flex";
    bar.style.alignItems = "center";
    bar.style.gap = "10px";
    bar.style.color = "rgba(255,255,255,0.92)";
    bar.style.font = "400 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif";

    const msg = document.createElement("div");
    msg.textContent = "Checking sign-in…";
    msg.style.flex = "1";

    const btnLogin = document.createElement("button");
    btnLogin.type = "button";
    btnLogin.textContent = "SIGN IN (Google)";
    btnLogin.style.border = "1px solid #b86b2a";
    btnLogin.style.background = "#2b2b2b";
    btnLogin.style.color = "#b86b2a";
    btnLogin.style.padding = "8px 12px";
    btnLogin.style.cursor = "pointer";

    const btnLogout = document.createElement("button");
    btnLogout.type = "button";
    btnLogout.textContent = "SIGN OUT";
    btnLogout.style.border = "1px solid #b86b2a";
    btnLogout.style.background = "#2b2b2b";
    btnLogout.style.color = "#b86b2a";
    btnLogout.style.padding = "8px 12px";
    btnLogout.style.cursor = "pointer";
    btnLogout.hidden = true;

    bar.appendChild(msg);
    bar.appendChild(btnLogin);
    bar.appendChild(btnLogout);

    const header = document.querySelector(".site-header");
    if (header && header.parentNode) {
      header.parentNode.insertBefore(bar, header.nextSibling);
    } else {
      document.body.insertBefore(bar, document.body.firstChild);
    }

    btnLogin.addEventListener("click", async () => {
      msg.textContent = "Signing in…";
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (e) {
        msg.textContent = `Sign-in failed: ${e?.message || e}`;
      }
    });

    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    let booted = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        btnLogin.hidden = false;
        btnLogout.hidden = true;
        if (adminMain) adminMain.style.display = "none";
        msg.textContent = "Sign in to access admin.";
        return;
      }

      const email = String(user.email || "").toLowerCase();

      if (!ALLOWED_EMAILS.has(email)) {
        msg.textContent = `Not authorised: ${user.email || "(no email)"}`;
        if (adminMain) adminMain.style.display = "none";
        btnLogin.hidden = false;
        btnLogout.hidden = true;
        await signOut(auth);
        return;
      }

      msg.textContent = `Signed in as ${user.email}`;
      btnLogin.hidden = true;
      btnLogout.hidden = false;
      if (adminMain) adminMain.style.display = "";

      if (!booted) {
        booted = true;
        bootDriversAdmin(user);
      }
    });

    function bootDriversAdmin(user) {
      const adminEmail = String(user?.email || "").toLowerCase();

      function setMsg(el, text, tone) {
        if (!el) return;
        el.classList.remove("ok", "bad");
        if (tone === "ok") el.classList.add("ok");
        if (tone === "bad") el.classList.add("bad");
        el.textContent = String(text || "");
      }

      function safeStr(value) {
        return String(value ?? "");
      }

      const driverNameEl = document.getElementById("driverName");
      const driverBadgeNoEl = document.getElementById("driverBadgeNo");
      const driverBadgeExpiryEl = document.getElementById("driverBadgeExpiry");
      const driverEmailEl = document.getElementById("driverEmail");
      const driverPhoneEl = document.getElementById("driverPhone");
      const saveDriverBtn = document.getElementById("saveDriver");
      const driverMsgEl = document.getElementById("driverMsg");
      const driversListMsgEl = document.getElementById("driversListMsg");
      const driversListEl = document.getElementById("driversList");
      const driverEditorTitleEl = document.getElementById("driverEditorTitle");
      const driverEditorLeadEl = document.getElementById("driverEditorLead");
      const cancelDriverEditBtn = document.getElementById("cancelDriverEdit");

      let selectedDriverId = "";

      function setDriverEditorMode(mode, driverId = "") {
        const editing = mode === "edit";
        selectedDriverId = editing ? driverId : "";

        if (driverEditorTitleEl) {
          driverEditorTitleEl.textContent = editing ? "Driver Profile" : "Drivers";
        }

        if (driverEditorLeadEl) {
          driverEditorLeadEl.textContent = editing
            ? "Amend this driver profile. The email address is the Google account assigned to this driver."
            : "Create a driver profile. The email address is the Google account that will be used to authorise the driver in the Tour The Lakes app.";
        }

        if (saveDriverBtn) {
          saveDriverBtn.textContent = editing ? "Save driver changes" : "Create driver";
        }

        if (cancelDriverEditBtn) {
          cancelDriverEditBtn.hidden = !editing;
        }
      }

      function clearDriverForm() {
        driverNameEl.value = "";
        driverBadgeNoEl.value = "";
        driverBadgeExpiryEl.value = "";
        driverEmailEl.value = "";
        driverPhoneEl.value = "";
      }

      function openDriverProfile(id, driver) {
        setDriverEditorMode("edit", id);
        driverNameEl.value = safeStr(driver.name);
        driverBadgeNoEl.value = safeStr(driver.badgeNo);
        driverBadgeExpiryEl.value = safeStr(driver.badgeExpiry);
        driverEmailEl.value = safeStr(driver.email);
        driverPhoneEl.value = safeStr(driver.phone);
        setMsg(driverMsgEl, `Editing driver: ${safeStr(driver.name)}`, null);
        document.getElementById("driversPanel")?.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      function renderDrivers(driversObj) {
        if (!driversListEl) return;

        driversListEl.innerHTML = "";

        if (!driversObj || typeof driversObj !== "object") {
          setMsg(driversListMsgEl, "No driver profiles yet.", null);
          return;
        }

        const entries = Object.entries(driversObj)
          .map(([id, driver]) => ({ id, driver: driver || {} }))
          .sort((a, b) => safeStr(a.driver.name).localeCompare(safeStr(b.driver.name)));

        setMsg(driversListMsgEl, `${entries.length} driver profile(s)`, null);

        for (const { id, driver } of entries) {
          const row = document.createElement("div");
          row.tabIndex = 0;
          row.setAttribute("role", "button");
          row.setAttribute(
            "aria-label",
            `Open driver profile for ${safeStr(driver.name)}`
          );

          const name = document.createElement("div");
          name.textContent = safeStr(driver.name);
          name.style.color = "rgba(255,255,255,0.92)";
          name.style.fontSize = "17px";
          name.style.fontWeight = "650";
          row.appendChild(name);

          const details = document.createElement("div");
          details.className = "admin-msg";
          details.style.marginTop = "6px";
          details.textContent =
            `Badge ${safeStr(driver.badgeNo)} • ` +
            `Expires ${safeStr(driver.badgeExpiry)} • ` +
            `${safeStr(driver.email)}` +
            `${driver.phone ? " • " + safeStr(driver.phone) : ""}`;
          row.appendChild(details);

          const open = () => openDriverProfile(id, driver);

          row.addEventListener("click", open);
          row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          });

          driversListEl.appendChild(row);
        }
      }

      onValue(
        ref(db, "drivers"),
        (snap) => {
          renderDrivers(snap.val());
        },
        (err) => {
          setMsg(
            driversListMsgEl,
            `Error loading drivers: ${err?.message || err}`,
            "bad"
          );
        }
      );

      cancelDriverEditBtn.addEventListener("click", () => {
        clearDriverForm();
        setDriverEditorMode("create");
        setMsg(driverMsgEl, "", null);
      });

      saveDriverBtn.addEventListener("click", async () => {
        const name = driverNameEl.value.trim();
        const badgeNo = driverBadgeNoEl.value.trim();
        const badgeExpiry = driverBadgeExpiryEl.value;
        const email = driverEmailEl.value.trim().toLowerCase();
        const phone = driverPhoneEl.value.trim();

        if (!name) {
          setMsg(driverMsgEl, "Name required.", "bad");
          return;
        }

        if (!badgeNo) {
          setMsg(driverMsgEl, "Badge No required.", "bad");
          return;
        }

        if (!badgeExpiry) {
          setMsg(driverMsgEl, "Badge Expiry required.", "bad");
          return;
        }

        if (!email || !driverEmailEl.checkValidity()) {
          setMsg(driverMsgEl, "Valid email required.", "bad");
          return;
        }

        try {
          const duplicateEmail = query(
            ref(db, "drivers"),
            orderByChild("email"),
            equalTo(email)
          );

          const duplicateSnap = await get(duplicateEmail);
          let emailUsedByAnotherDriver = false;

          duplicateSnap.forEach((child) => {
            if (child.key !== selectedDriverId) {
              emailUsedByAnotherDriver = true;
            }
          });

          if (emailUsedByAnotherDriver) {
            setMsg(
              driverMsgEl,
              "A driver profile already exists for this email address.",
              "bad"
            );
            return;
          }

          if (selectedDriverId) {
            await update(ref(db, `drivers/${selectedDriverId}`), {
              name,
              badgeNo,
              badgeExpiry,
              email,
              phone,
              updatedAt: serverTimestamp(),
              updatedBy: adminEmail,
            });

            setMsg(driverMsgEl, `Driver updated: ${name}`, "ok");
          } else {
            const driverRef = push(ref(db, "drivers"));

            await set(driverRef, {
              name,
              badgeNo,
              badgeExpiry,
              email,
              phone,
              createdAt: serverTimestamp(),
              createdBy: adminEmail,
              updatedAt: serverTimestamp(),
              updatedBy: adminEmail,
            });

            clearDriverForm();
            setMsg(driverMsgEl, `Driver created: ${name}`, "ok");
          }
        } catch (err) {
          setMsg(driverMsgEl, `Error: ${err?.message || err}`, "bad");
        }
      });

      setDriverEditorMode("create");

      // Ready for the rebuild: db is Drivers only; Storage is the new backend connection.
      void storage;
    }
  </script>
</body>
</html>
